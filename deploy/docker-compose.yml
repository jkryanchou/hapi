services:
  # ─── Personal hub ────────────────────────────────────────────────────────────
  # NOTE: the runners are no longer Docker services. They run as Incus (LXC)
  # system containers provisioned from deploy/incus/ (see HANDOFF.md). Each hub
  # is published on the Incus bridge gateway (10.236.0.1) so the Incus runners
  # can reach it over HAPI_API_URL — private to the host, not the public net.
  hapi-personal:
    image: ghcr.io/jkryanchou/hapi-hub:latest
    restart: unless-stopped
    environment:
      HAPI_LISTEN_HOST: 0.0.0.0
      HAPI_LISTEN_PORT: 3006
      HAPI_PUBLIC_URL: https://hapi-personal.jkryanchou.com
      CLI_API_TOKEN: ${PERSONAL_TOKEN}
      TELEGRAM_BOT_TOKEN: ${PERSONAL_TELEGRAM_BOT_TOKEN}
    ports:
      - "${INCUS_GW:-10.236.0.1}:3006:3006"   # reachable by the Incus personal-runner
    volumes:
      - hapi-personal-data:/root/.hapi
    networks:
      - hapi-net

  # ─── Work hub ─────────────────────────────────────────────────────────────────
  hapi-work:
    image: ghcr.io/jkryanchou/hapi-hub:latest
    restart: unless-stopped
    environment:
      HAPI_LISTEN_HOST: 0.0.0.0
      HAPI_LISTEN_PORT: 3006
      HAPI_PUBLIC_URL: https://hapi-work.jkryanchou.com
      CLI_API_TOKEN: ${WORK_TOKEN}
      TELEGRAM_BOT_TOKEN: ${WORK_TELEGRAM_BOT_TOKEN}
    ports:
      - "${INCUS_GW:-10.236.0.1}:3007:3006"   # reachable by the Incus work-runner
    volumes:
      - hapi-work-data:/root/.hapi
    networks:
      - hapi-net

  # ─── Cloudflare Tunnel ────────────────────────────────────────────────────────
  # Routes hapi-personal.jkryanchou.com → http://hapi-personal:3006
  #        hapi-work.jkryanchou.com     → http://hapi-work:3006
  # Ingress is configured remotely in the Cloudflare dashboard (Zero Trust →
  # Networks → Tunnels → hapi → Public Hostname). The container just carries
  # the tunnel token; routing is owned by Cloudflare's remotely-managed config.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - hapi-personal
      - hapi-work
    networks:
      - hapi-net

networks:
  hapi-net:

volumes:
  hapi-personal-data:
  hapi-work-data:
