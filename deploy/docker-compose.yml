services:
  # ─── HAPI hub (single, merged) ───────────────────────────────────────────────
  # One hub at https://hapi.jkryanchou.com, namespace 'default'. Replaces the old
  # personal+work split. Runners are NOT Docker services — they run as Incus (LXC)
  # system containers provisioned from deploy/incus/ (see HANDOFF.md):
  #   - netcup  hapi-personal-runner → http://10.236.0.1:3006 (same host, bridge GW)
  #   - devnode hapi-work-runner     → https://hapi.jkryanchou.com (via the tunnel)
  hapi:
    image: ghcr.io/jkryanchou/hapi-hub:latest
    restart: unless-stopped
    environment:
      HAPI_LISTEN_HOST: 0.0.0.0
      HAPI_LISTEN_PORT: 3006
      HAPI_PUBLIC_URL: https://hapi.jkryanchou.com
      CLI_API_TOKEN: ${HAPI_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "${INCUS_GW:-10.236.0.1}:3006:3006"   # reachable by the local netcup Incus runner
    volumes:
      # Volume KEY intentionally kept as `hapi-personal-data` so the existing docker
      # volume `deploy_hapi-personal-data` (the former personal hub's SQLite/state,
      # JWT secret, owner id, Telegram bindings) is reused with NO data migration.
      - hapi-personal-data:/root/.hapi
    networks:
      - hapi-net

  # ─── Cloudflare Tunnel ───────────────────────────────────────────────────────
  # Single public hostname: hapi.jkryanchou.com → http://hapi:3006
  # Ingress is configured remotely in the Cloudflare dashboard (Zero Trust →
  # Networks → Tunnels → hapi → Public Hostname). The container just carries
  # the tunnel token; routing is owned by Cloudflare's remotely-managed config.
  # --protocol http2 required (QUIC/UDP blocked on netcup; SSE needs it).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - hapi
    networks:
      - hapi-net

networks:
  hapi-net:

volumes:
  # Historical name: this was the personal hub's volume; kept so deploy_hapi-personal-data
  # carries over (sessions, JWT secret, Telegram bindings) without a data migration.
  hapi-personal-data:
